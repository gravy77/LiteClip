<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="LiteClip numbers: 4 MB executable, under 1 second to save, no network; while recording 1080p30 on an i5-1035G4, ffmpeg uses about 17% of one core and the UI about 2%">
<rect x="0" y="0" width="1280" height="300" rx="20" fill="#f6f7f9"/><rect x="0.5" y="0.5" width="1279" height="299" rx="20" fill="none" stroke="rgba(22,23,26,0.10)"/><text x="56" y="122" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#16171a"><tspan font-size="52" font-weight="500">4</tspan><tspan font-size="22" fill="#555a64" dx="6">MB</tspan></text><text x="56" y="154" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#555a64">single executable</text><text x="232" y="122" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#16171a"><tspan font-size="52" font-weight="500">&lt;1</tspan><tspan font-size="22" fill="#555a64" dx="6">s</tspan></text><text x="232" y="154" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#555a64">to save a clip</text><text x="408" y="122" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#16171a"><tspan font-size="52" font-weight="500">0</tspan><tspan font-size="22" fill="#555a64" dx="6">requests</tspan></text><text x="408" y="154" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#555a64">no network at all</text><text x="56" y="236" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#868b95">Measured on an Intel i5-1035G4 laptop</text><text x="56" y="258" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#868b95">with Iris Plus graphics, 1080p at 30 fps</text><line x1="640" y1="48" x2="640" y2="252" stroke="rgba(22,23,26,0.10)"/><text x="688" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#16171a">CPU while recording</text><text x="1224" y="64" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#868b95" text-anchor="end">% of one core</text><line x1="688" y1="96" x2="688" y2="236" stroke="rgba(22,23,26,0.10)"/><text x="688" y="258" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#868b95">0%</text><line x1="822" y1="96" x2="822" y2="236" stroke="rgba(22,23,26,0.10)"/><text x="822" y="258" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#868b95" text-anchor="middle">25%</text><line x1="956" y1="96" x2="956" y2="236" stroke="rgba(22,23,26,0.10)"/><text x="956" y="258" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#868b95" text-anchor="middle">50%</text><line x1="1090" y1="96" x2="1090" y2="236" stroke="rgba(22,23,26,0.10)"/><text x="1090" y="258" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#868b95" text-anchor="middle">75%</text><line x1="1224" y1="96" x2="1224" y2="236" stroke="rgba(22,23,26,0.10)"/><text x="1224" y="258" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#868b95" text-anchor="end">100%</text><text x="688" y="120" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#555a64">ffmpeg (capture + encode)</text><rect x="688" y="130" width="91.12" height="28" rx="4" fill="#2f86ea"/><text x="789.12" y="150" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="14" font-weight="400" fill="#16171a">≈17%</text><text x="688" y="186" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#555a64">LiteClip window</text><rect x="688" y="196" width="10.72" height="28" rx="4" fill="#868b95"/><text x="708.72" y="216" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="14" font-weight="400" fill="#16171a">≈2%</text>
</svg>
