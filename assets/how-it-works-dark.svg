<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="How LiteClip works: FFmpeg captures and encodes the screen into 2-second segments while Rust mixes system sound and microphone; F8 joins the latest segments with stream copy into an MP4">
<rect x="0" y="0" width="1280" height="470" rx="20" fill="#18191d"/><rect x="0.5" y="0.5" width="1279" height="469" rx="20" fill="none" stroke="rgba(232,233,236,0.09)"/><text x="48" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#e8e9ec">How a clip is made</text><text x="48" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#a1a4ad">Video and audio are encoded once, while you play. Saving only copies what is already on disk.</text><rect x="48" y="132" width="236" height="76" rx="12" fill="#1e1f24" stroke="rgba(232,233,236,0.16)"/><text x="68" y="164" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#e8e9ec">Screen</text><text x="68" y="188" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#a1a4ad">Desktop Duplication</text><rect x="48" y="270" width="236" height="76" rx="12" fill="#1e1f24" stroke="rgba(232,233,236,0.16)"/><text x="68" y="302" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#e8e9ec">System sound</text><text x="68" y="326" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#a1a4ad">WASAPI loopback</text><rect x="48" y="362" width="236" height="76" rx="12" fill="#1e1f24" stroke="rgba(232,233,236,0.16)"/><text x="68" y="394" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#e8e9ec">Microphone</text><text x="68" y="418" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#a1a4ad">any input device</text><rect x="316" y="316" width="216" height="76" rx="12" fill="#1e1f24" stroke="rgba(232,233,236,0.16)"/><text x="336" y="348" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#e8e9ec">Audio mixer</text><text x="336" y="372" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#a1a4ad">Rust · cpal · 48 kHz</text><path d="M284 308 H298 V346 H310" fill="none" stroke="#6c707a" stroke-width="1.5"/><path d="M310 341 L316 346 L310 351" fill="none" stroke="#6c707a" stroke-width="1.5"/><path d="M284 400 H298 V362 H310" fill="none" stroke="#6c707a" stroke-width="1.5"/><path d="M310 357 L316 362 L310 367" fill="none" stroke="#6c707a" stroke-width="1.5"/><rect x="624" y="120" width="300" height="318" rx="16" fill="#101114" stroke="rgba(232,233,236,0.09)"/><text x="644" y="150" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#6c707a">FFmpeg</text><rect x="640" y="168" width="268" height="70" rx="10" fill="#1e1f24" stroke="rgba(232,233,236,0.16)"/><text x="660" y="198" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e9ec">Capture</text><text x="660" y="220" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#a1a4ad">ddagrab, or GDI fallback</text><rect x="640" y="254" width="268" height="70" rx="10" fill="#1e1f24" stroke="rgba(232,233,236,0.16)"/><text x="660" y="284" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e9ec">Encode on the GPU</text><text x="660" y="306" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#a1a4ad">NVENC · Quick Sync · AMF</text><rect x="640" y="340" width="268" height="70" rx="10" fill="#1e1f24" stroke="rgba(232,233,236,0.16)"/><text x="660" y="370" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e9ec">Split into segments</text><text x="660" y="392" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#a1a4ad">2 s MPEG-TS files</text><path d="M284 170 H634" fill="none" stroke="#6c707a" stroke-width="1.5"/><path d="M634 165 L640 170 L634 175" fill="none" stroke="#6c707a" stroke-width="1.5"/><path d="M532 354 H596 V289 H634" fill="none" stroke="#6c707a" stroke-width="1.5"/><text x="538" y="344" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="12" font-weight="400" fill="#6c707a">PCM pipe</text><path d="M634 284 L640 289 L634 294" fill="none" stroke="#6c707a" stroke-width="1.5"/><path d="M774 238 V254" stroke="#6c707a" stroke-width="1.5"/><path d="M774 324 V340" stroke="#6c707a" stroke-width="1.5"/><rect x="976" y="132" width="256" height="132" rx="12" fill="#1e1f24" stroke="rgba(232,233,236,0.16)"/><text x="996" y="164" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#e8e9ec">Replay buffer</text><text x="996" y="188" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#a1a4ad">last N seconds on disk</text><rect x="996" y="210" width="23" height="30" rx="4" fill="#26272d" stroke="rgba(232,233,236,0.09)" opacity="0.35"/><rect x="1023" y="210" width="23" height="30" rx="4" fill="#26272d" stroke="rgba(232,233,236,0.09)" opacity="0.48"/><rect x="1050" y="210" width="23" height="30" rx="4" fill="#26272d" stroke="rgba(232,233,236,0.09)" opacity="0.61"/><rect x="1077" y="210" width="23" height="30" rx="4" fill="#26272d" stroke="rgba(232,233,236,0.09)" opacity="0.74"/><rect x="1104" y="210" width="23" height="30" rx="4" fill="#26272d" stroke="rgba(232,233,236,0.09)" opacity="0.87"/><rect x="1131" y="210" width="23" height="30" rx="4" fill="rgba(64,156,255,0.55)"/><rect x="1158" y="210" width="23" height="30" rx="4" fill="rgba(64,156,255,0.55)"/><rect x="1185" y="210" width="23" height="30" rx="4" fill="rgba(64,156,255,0.55)"/><path d="M924 375 H950 V198 H970" fill="none" stroke="#6c707a" stroke-width="1.5"/><path d="M970 193 L976 198 L970 203" fill="none" stroke="#6c707a" stroke-width="1.5"/><g><rect x="976" y="303" width="56" height="48" rx="10" fill="#0c0d10"/><rect x="976" y="300" width="56" height="48" rx="10" fill="#2c2d34" stroke="rgba(232,233,236,0.16)" stroke-width="1"/><text x="1004" y="331" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="19" font-weight="500" fill="#e8e9ec" text-anchor="middle">F8</text></g><text x="1048" y="324" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#a1a4ad">join + trim</text><text x="1048" y="344" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#6fb4ff">-c copy</text><path d="M1080 264 V292" stroke="#409cff" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="976" y="368" width="256" height="70" rx="12" fill="#1e1f24" stroke="#409cff" stroke-opacity="0.6"/><text x="996" y="398" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="15" font-weight="500" fill="#e8e9ec">Clip … .mp4</text><text x="996" y="420" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, ui-monospace, monospace" font-size="13" font-weight="400" fill="#a1a4ad">Videos\LiteClip · &lt; 1 s</text>
</svg>
