<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4aa3ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4aa3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>

  <!-- timeline strip -->
  <g opacity="0.55">
    <rect x="470" y="236" width="640" height="10" rx="5" fill="#262c3b"/>
    <rect x="470" y="236" width="230" height="10" rx="5" fill="url(#accent)"/>
    <rect x="760" y="236" width="120" height="10" rx="5" fill="#5a2a2e"/>
    <rect x="900" y="236" width="210" height="10" rx="5" fill="url(#accent)"/>
    <rect x="726" y="226" width="3" height="30" rx="1.5" fill="#ffffff"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(150 80)">
    <rect width="160" height="160" rx="38" fill="url(#accent)"/>
    <rect x="10" y="10" width="140" height="140" rx="30" fill="#121520" opacity="0.9"/>
    <circle cx="80" cy="80" r="44" fill="none" stroke="url(#accent)" stroke-width="8"/>
    <path d="M68 58 L104 80 L68 102 Z" fill="#ffffff"/>
    <circle cx="124" cy="36" r="9" fill="#ff4d5e"/>
  </g>

  <text x="360" y="160" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Lite<tspan fill="url(#accent)">Clip</tspan></text>
  <text x="364" y="208" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#9aa4b8">Instant game clips for low-end PCs · offline · tiny · Rust</text>
</svg>
