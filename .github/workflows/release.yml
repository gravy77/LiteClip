name: Release

# Push a tag like v0.1.0 to build LiteClip.exe and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=liteclip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/liteclip.exe LiteClip.exe
          Compress-Archive -Path LiteClip.exe, README.md, LICENSE -DestinationPath LiteClip-${{ github.ref_name }}-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LiteClip.exe
            LiteClip-${{ github.ref_name }}-windows-x64.zip
