[package]
name = "liteclip"
version = "0.1.0"
edition = "2021"
description = "Lightweight offline replay-buffer clipper and mini editor"
license = "MIT"
readme = "README.md"
repository = "https://github.com/gravy77/LiteClip"
keywords = ["clipping", "screen-recorder", "replay-buffer", "gaming", "video-editor"]
categories = ["multimedia::video"]

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
cpal = "0.15"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
